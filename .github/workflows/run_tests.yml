name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        configuration: [Release]

    runs-on: windows-latest

    env:
      Solution_Name: Remotely.sln
      Configuration: ${{ matrix.configuration }}
      Test_Project_Path: Tests\Tests.csproj

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    - name: Disable LibMan network restore
      shell: pwsh
      run: Move-Item Server/libman.json Server/libman.json.ci-disabled

    - name: Execute unit tests
      run: dotnet test --configuration $env:Configuration
