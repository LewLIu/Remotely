name: Browser Low Latency Tests

on:
  push:
    branches:
      - feature/emergency-manager-low-bandwidth
    paths:
      - Server/wwwroot/src/**
      - .github/browser-tests/**
      - .github/workflows/browser-low-latency-tests.yml
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Type-check changed browser source
        run: |
          npx --yes -p typescript@5.6.2 tsc \
            --target ES2020 \
            --module ES2020 \
            --moduleResolution node \
            --lib DOM,ES2020 \
            --skipLibCheck \
            --noEmit \
            Server/wwwroot/src/CaptureProcessor.ts \
            Server/wwwroot/src/MessageSender.ts
      - name: Compile browser policy tests
        run: |
          rm -rf browser-test-out
          npx --yes -p typescript@5.6.2 tsc \
            --target ES2020 \
            --module commonjs \
            --moduleResolution node \
            --lib DOM,ES2020 \
            --skipLibCheck \
            --rootDir . \
            --outDir browser-test-out \
            Server/wwwroot/src/FrameBufferPolicy.ts \
            .github/browser-tests/FrameBufferPolicyTests.ts
      - name: Run browser policy tests
        run: node browser-test-out/.github/browser-tests/FrameBufferPolicyTests.js
